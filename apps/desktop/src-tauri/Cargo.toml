[package]
name = "hermes-desktop"
version = "0.1.0"
description = "HERMES — agent IA desktop multi-agents"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hermes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"
